project:
  name: "explainable-ner-lowres"
  languages:
    - "konkani"
    - "assamese"
    - "sinhala"

seed: 42

logging:
  backend: "csv"
  log_dir: "reports/experiment_logs/"

data_collection:
  min_sentence_length: 3
  script_purity_threshold: 0.90
  dedup_method: "sha256"
  max_articles_per_wiki: 5000
  sources:
    konkani:
      wiki_code: "gom"
      script_name: "devanagari"
      script_range:
        - [2304, 2431]
      news_feeds:
        - "https://www.heraldgoa.in"
        - "https://www.bhaangarbhuin.com"
      other_sources:
        - "https://raw.githubusercontent.com/indicnlp/indicnlp-corpus/master/konkani"
    assamese:
      wiki_code: "as"
      script_name: "bengali_assamese"
      script_range:
        - [2432, 2559]
      news_feeds:
        - "https://asomiya.pratidintime.com"
        - "https://www.niyomiyabarta.com"
      other_sources:
        - "https://raw.githubusercontent.com/indicnlp/indicnlp-corpus/master/assamese"
    sinhala:
      wiki_code: "si"
      script_name: "sinhala"
      script_range:
        - [3456, 3583]
      news_feeds:
        - "https://sinhala.adaderana.lk"
        - "https://www.dinamina.lk"
      other_sources:
        - "https://raw.githubusercontent.com/indicnlp/indicnlp-corpus/master/sinhala"

preprocessing:
  unicode_normalization: "NFC"
  min_word_freq: 2
  max_vocab_size: 30000
  char_min_freq: 1
  abbreviations:
    konkani:
      - "डॉ."
      - "प्रा."
      - "श्री."
      - "श्रीमती."
      - "पं."
      - "इ."
      - "उदा."
    assamese:
      - "ড°"
      - "ডাঃ"
      - "শ্ৰী"
      - "শ্ৰীমতী"
      - "প্ৰাঃ"
      - "ইত্যাদি"
      - "উদাঃ"
    sinhala:
      - "ඩොක්ටර්"
      - "මහාචාර්ය"
      - "ගරු"
      - "පූජ්‍ය"
      - "පෙ.ව."
      - "ප.ව."
      - "ආදී"

annotation:
  target_sentence_count: 1000
  split_ratios:
    train: 0.60
    dev: 0.20
    test: 0.20
  kappa_threshold: 0.75
  overlap_sample_size: 100
  tagset:
    - "O"
    - "B-PER"
    - "I-PER"
    - "B-LOC"
    - "I-LOC"
    - "B-ORG"
    - "I-ORG"
    - "B-MISC"
    - "I-MISC"

weak_supervision:
  gazetteer_match_mode: "exact"
  aggregation_method: "weighted_majority_vote"
  min_precision_threshold: 0.70
  target_volume_multiplier: 12
  stoplist:
    konkani:
      - "हो"
      - "तो"
      - "आहे"
      - "एक"
      - "दोन"
      - "आनी"
      - "पुण"
      - "ना"
    assamese:
      - "এই"
      - "সেই"
      - "হয়"
      - "এক"
      - "দুটা"
      - "আৰু"
      - "নহয়"
    sinhala:
      - "මේ"
      - "එය"
      - "වේ"
      - "එක"
      - "දෙක"
      - "සහ"
      - "නැත"

model:
  word_embedding_dim: 100
  bilstm_hidden_dim: 128
  bilstm_layers: 2
  dropout: 0.3
  use_crf: true

char_cnn:
  char_embedding_dim: 50
  filter_widths:
    - 3
    - 4
    - 5
  filters_per_width: 30
  char_dropout: 0.3
  concat_dropout: 0.3

attention:
  num_heads: 4
  num_attention_blocks: 1
  attention_dropout: 0.1
  warmup_steps: 100

multilingual:
  lang_embedding_dim: 16
  crf_config: "shared"
  sampling_strategy: "uniform"
  num_languages: 3

finetune:
  learning_rate: 0.0002
  unfreeze_epoch: 4
  schedule: "phased"

self_training:
  initial_threshold: 0.90
  threshold_step: 0.02
  max_rounds: 4
  volume_cap_multiplier: 3.0
  learning_rate: 0.0001
  batch_size: 32
  max_epochs_per_round: 15
  patience: 4

training:
  batch_size: 32
  learning_rate: 0.001
  max_epochs: 30
  early_stopping_patience: 5
  use_silver_data: true
  device: "auto"
  use_class_weights: false


