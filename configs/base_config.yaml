project:
  name: "explainable-ner-lowres"
  languages:
    - "konkani"
    - "assamese"
    - "sinhala"

seed: 42

logging:
  backend: "csv"
  log_dir: "reports/experiment_logs/"

data_collection:
  min_sentence_length: 3
  script_purity_threshold: 0.90
  dedup_method: "sha256"
  max_articles_per_wiki: 5000
  sources:
    konkani:
      wiki_code: "gom"
      script_name: "devanagari"
      script_range:
        - [2304, 2431]
      news_feeds:
        - "https://www.heraldgoa.in"
        - "https://www.bhaangarbhuin.com"
      other_sources:
        - "https://raw.githubusercontent.com/indicnlp/indicnlp-corpus/master/konkani"
    assamese:
      wiki_code: "as"
      script_name: "bengali_assamese"
      script_range:
        - [2432, 2559]
      news_feeds:
        - "https://asomiya.pratidintime.com"
        - "https://www.niyomiyabarta.com"
      other_sources:
        - "https://raw.githubusercontent.com/indicnlp/indicnlp-corpus/master/assamese"
    sinhala:
      wiki_code: "si"
      script_name: "sinhala"
      script_range:
        - [3456, 3583]
      news_feeds:
        - "https://sinhala.adaderana.lk"
        - "https://www.dinamina.lk"
      other_sources:
        - "https://raw.githubusercontent.com/indicnlp/indicnlp-corpus/master/sinhala"

preprocessing:
  unicode_normalization: "NFC"
  min_word_freq: 2
  max_vocab_size: 30000
  char_min_freq: 1
  abbreviations:
    konkani:
      - "डॉ."
      - "प्रा."
      - "श्री."
      - "श्रीमती."
      - "पं."
      - "इ."
      - "उदा."
    assamese:
      - "ড°"
      - "ডাঃ"
      - "শ্ৰী"
      - "শ্ৰীমতী"
      - "প্ৰাঃ"
      - "ইত্যাদি"
      - "উদাঃ"
    sinhala:
      - "ඩොක්ටර්"
      - "මහාචාර්ය"
      - "ගරු"
      - "පූජ්‍ය"
      - "පෙ.ව."
      - "ප.ව."
      - "ආදී"

annotation:
  target_sentence_count: 1000
  split_ratios:
    train: 0.60
    dev: 0.20
    test: 0.20
  kappa_threshold: 0.75
  overlap_sample_size: 100
  tagset:
    - "O"
    - "B-PER"
    - "I-PER"
    - "B-LOC"
    - "I-LOC"
    - "B-ORG"
    - "I-ORG"
    - "B-MISC"
    - "I-MISC"
